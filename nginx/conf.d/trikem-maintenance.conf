# Trikem underhållsläge – http-kontext (laddas automatiskt från /etc/nginx/conf.d/).
#
# IP-adresser som ska se Odoo som vanligt även när underhållsläget är på,
# t.ex. Implefys kontor för att testa Odoo 19 på riktiga domänen.
# Fyll i på servern – lägg INTE in riktiga IP-adresser här, repot är publikt.
geo $trikem_maint_bypass {
    default     0;
    127.0.0.1   1;
    # 203.0.113.10  1;   # exempel
}
