# Trikem underhållsläge – inkluderas i server-blocket för varje domän som ska
# stängas, direkt efter server_name:
#
#     include snippets/trikem-maintenance.conf;
#
# Läget styrs av filen /var/www/trikem-maintenance/ON (ingen reload behövs):
#     finns filen  -> alla utom IP:n i $trikem_maint_bypass får underhållssidan (HTTP 503)
#     saknas filen -> trafiken går till Odoo som vanligt

set $trikem_maint 0;
if (-f /var/www/trikem-maintenance/ON)          { set $trikem_maint 1; }
if ($trikem_maint_bypass)                       { set $trikem_maint 0; }
if ($uri = /__trikem_maintenance/index.html)    { set $trikem_maint 0; }
if ($trikem_maint)                              { return 503; }

# Intern URI (inte @named) så att även POST/PUT får sidan i stället för 405.
error_page 503 /__trikem_maintenance/index.html;

location ^~ /__trikem_maintenance/ {
    internal;
    alias /var/www/trikem-maintenance/;
    default_type text/html;
    add_header Retry-After 3600 always;
    add_header Cache-Control "no-store" always;
}
