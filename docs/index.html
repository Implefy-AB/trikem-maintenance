<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trikem – vi uppdaterar vår webbshop</title>
  <style>
    :root { --bg:#000; --fg:#fff; --muted:#bdbdbd; --accent:#4aa14a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 52rem; }
    .logo { display: block; width: min(520px, 80%); height: auto; margin: 0 auto 48px; }
    h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin: 0 0 20px; font-weight: 700; }
    p { color: var(--muted); font-size: clamp(1.1rem, 2.4vw, 1.5rem); line-height: 1.6; margin: 0 0 16px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="logo.png" alt="Trikem">
    <h1>Vi uppdaterar vår webbshop</h1>
    <p>Webbshopen är tillfälligt stängd medan vi gör en uppdatering. Vi är tillbaka så snart som möjligt.</p>
    <p>Vi tar gärna emot din order på <a href="mailto:order@trikem.se">order@trikem.se</a>.</p>
  </main>
</body>
</html>
